<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오목</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c1f26;
    --ink-soft: #262a33;
    --paper: #efe7d6;
    --wood-top: #e8c188;
    --wood-bot: #cf9c56;
    --line: rgba(58, 40, 18, 0.6);
    --jade: #6fae9c;
    --jade-deep: #4f8a79;
    --muted: #9aa0ab;
    --white-stone: #f6f4ef;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(120% 90% at 50% -10%, #2b303b 0%, var(--ink) 60%);
    color: var(--paper);
    font-family: "IBM Plex Sans KR", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 48px;
    gap: 22px;
  }

  header {
    text-align: center;
    line-height: 1;
  }

  h1 {
    font-family: "Gowun Batang", serif;
    font-weight: 700;
    font-size: 44px;
    letter-spacing: 8px;
    margin: 0;
    color: var(--paper);
  }

  .subtitle {
    margin-top: 8px;
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .status-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    min-height: 34px;
    font-size: 17px;
    font-weight: 500;
  }

  .turn-dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.4), 0 2px 5px rgba(0,0,0,0.5);
  }
  .turn-dot.black { background: radial-gradient(circle at 35% 30%, #565b66, #0d0f13); }
  .turn-dot.white { background: radial-gradient(circle at 35% 30%, #ffffff, #c8c6bf); }

  .status-win { color: var(--jade); font-weight: 600; }

  .board-wrap {
    position: relative;
    padding: 18px;
    border-radius: 14px;
    background: linear-gradient(160deg, #6a4a26, #43301a);
    box-shadow: 0 24px 50px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.06);
  }

  canvas {
    display: block;
    border-radius: 6px;
    cursor: pointer;
    touch-action: manipulation;
  }

  .scoreboard {
    display: flex;
    gap: 28px;
    align-items: center;
    font-size: 14px;
    color: var(--muted);
  }
  .scoreboard b { color: var(--paper); font-weight: 600; }

  .controls {
    display: flex;
    gap: 12px;
  }

  button {
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    color: var(--paper);
    background: var(--ink-soft);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 11px 20px;
    cursor: pointer;
    transition: transform .08s ease, background .15s ease, border-color .15s ease;
  }
  button:hover { background: #313745; border-color: rgba(255,255,255,0.2); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--jade-deep); border-color: var(--jade); }
  button.primary:hover { background: var(--jade); }
  button:disabled { opacity: .4; cursor: not-allowed; transform: none; }

  :focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }

  @media (max-width: 520px) {
    h1 { font-size: 34px; letter-spacing: 5px; }
    .board-wrap { padding: 12px; }
  }
</style>
</head>
<body>
  <header>
    <h1>오목</h1>
    <div class="subtitle">Five in a Row</div>
  </header>

  <div class="status-bar" id="status">
    <span class="turn-dot black" id="turnDot"></span>
    <span id="statusText">흑돌 차례</span>
  </div>

  <div class="board-wrap">
    <canvas id="board" width="600" height="600"></canvas>
  </div>

  <div class="scoreboard">
    <span>흑 <b id="scoreBlack">0</b></span>
    <span>·</span>
    <span>백 <b id="scoreWhite">0</b></span>
    <span>·</span>
    <span><b id="moveCount">0</b>수</span>
  </div>

  <div class="controls">
    <button id="undoBtn">되돌리기</button>
    <button id="resetBtn" class="primary">새 게임</button>
  </div>

<script>
(function () {
  const SIZE = 15;              // 15x15 바둑판
  const STAR = [[3,3],[11,3],[3,11],[11,11],[7,7]]; // 화점
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');

  const statusText = document.getElementById('statusText');
  const turnDot = document.getElementById('turnDot');
  const moveCountEl = document.getElementById('moveCount');
  const scoreBlackEl = document.getElementById('scoreBlack');
  const scoreWhiteEl = document.getElementById('scoreWhite');
  const undoBtn = document.getElementById('undoBtn');
  const resetBtn = document.getElementById('resetBtn');

  let board, current, history, gameOver, winLine, hover;
  let score = { black: 0, white: 0 };
  let margin, gap;

  function reset() {
    board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0)); // 0 빈칸, 1 흑, 2 백
    current = 1;
    history = [];
    gameOver = false;
    winLine = null;
    hover = null;
    updateStatus();
    draw();
  }

  function layout() {
    // 화면 폭에 맞춰 캔버스 크기 조정
    const wrapWidth = Math.min(600, window.innerWidth - 68);
    const px = Math.max(300, wrapWidth);
    canvas.style.width = px + 'px';
    canvas.style.height = px + 'px';
    const dpr = window.devicePixelRatio || 1;
    canvas.width = px * dpr;
    canvas.height = px * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    margin = px * 0.055;
    gap = (px - margin * 2) / (SIZE - 1);
    draw();
  }

  function draw() {
    const px = parseFloat(canvas.style.width);
    // 나무 바탕
    const grad = ctx.createLinearGradient(0, 0, 0, px);
    grad.addColorStop(0, getVar('--wood-top'));
    grad.addColorStop(1, getVar('--wood-bot'));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, px, px);

    // 격자
    ctx.strokeStyle = getVar('--line');
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < SIZE; i++) {
      const p = margin + i * gap;
      ctx.moveTo(margin, p); ctx.lineTo(px - margin, p);
      ctx.moveTo(p, margin); ctx.lineTo(p, px - margin);
    }
    ctx.stroke();

    // 화점
    ctx.fillStyle = getVar('--line');
    for (const [c, r] of STAR) {
      ctx.beginPath();
      ctx.arc(margin + c * gap, margin + r * gap, gap * 0.09, 0, Math.PI * 2);
      ctx.fill();
    }

    // 호버 미리보기
    if (hover && !gameOver && board[hover.r][hover.c] === 0) {
      drawStone(hover.c, hover.r, current, 0.35);
    }

    // 착수된 돌
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (board[r][c]) drawStone(c, r, board[r][c], 1);
      }
    }

    // 마지막 착수 표시
    if (history.length && !winLine) {
      const last = history[history.length - 1];
      const x = margin + last.c * gap, y = margin + last.r * gap;
      ctx.strokeStyle = getVar('--jade');
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, gap * 0.28, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 승리 라인 강조
    if (winLine) {
      ctx.strokeStyle = getVar('--jade');
      ctx.lineWidth = gap * 0.14;
      ctx.lineCap = 'round';
      const a = winLine[0], b = winLine[winLine.length - 1];
      ctx.beginPath();
      ctx.moveTo(margin + a.c * gap, margin + a.r * gap);
      ctx.lineTo(margin + b.c * gap, margin + b.r * gap);
      ctx.stroke();
    }
  }

  function drawStone(c, r, player, alpha) {
    const x = margin + c * gap, y = margin + r * gap, rad = gap * 0.42;
    ctx.save();
    ctx.globalAlpha = alpha;
    // 그림자
    ctx.beginPath();
    ctx.arc(x + 1.5, y + 2, rad, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fill();
    // 돌
    const g = ctx.createRadialGradient(x - rad * 0.35, y - rad * 0.4, rad * 0.1, x, y, rad);
    if (player === 1) { g.addColorStop(0, '#5a606c'); g.addColorStop(1, '#0c0e12'); }
    else { g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#cbc8c0'); }
    ctx.beginPath();
    ctx.arc(x, y, rad, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();
  }

  function place(c, r) {
    if (gameOver || board[r][c] !== 0) return;
    board[r][c] = current;
    history.push({ c, r, player: current });
    moveCountEl.textContent = history.length;

    const line = checkWin(c, r, current);
    if (line) {
      winLine = line;
      gameOver = true;
      if (current === 1) score.black++; else score.white++;
      scoreBlackEl.textContent = score.black;
      scoreWhiteEl.textContent = score.white;
      updateStatus(true);
    } else if (history.length === SIZE * SIZE) {
      gameOver = true;
      statusText.textContent = '무승부입니다';
      statusText.className = '';
      turnDot.style.display = 'none';
    } else {
      current = current === 1 ? 2 : 1;
      updateStatus();
    }
    draw();
  }

  // 놓인 돌 기준 4방향 확인, 5목이면 승리 라인 반환
  function checkWin(c, r, player) {
    const dirs = [[1,0],[0,1],[1,1],[1,-1]];
    for (const [dc, dr] of dirs) {
      const line = [{ c, r }];
      for (const s of [1, -1]) {
        let nc = c + dc * s, nr = r + dr * s;
        while (inBounds(nc, nr) && board[nr][nc] === player) {
          line.push({ c: nc, r: nr });
          nc += dc * s; nr += dr * s;
        }
      }
      if (line.length >= 5) {
        line.sort((a, b) => (a.c - b.c) || (a.r - b.r));
        return line;
      }
    }
    return null;
  }

  function undo() {
    if (!history.length) return;
    const last = history.pop();
    board[last.r][last.c] = 0;
    current = last.player;
    gameOver = false;
    winLine = null;
    turnDot.style.display = '';
    moveCountEl.textContent = history.length;
    updateStatus();
    draw();
  }

  function updateStatus(won) {
    if (won) {
      statusText.textContent = (current === 1 ? '흑돌' : '백돌') + ' 승리!';
      statusText.className = 'status-win';
      turnDot.style.display = 'none';
      return;
    }
    turnDot.style.display = '';
    turnDot.className = 'turn-dot ' + (current === 1 ? 'black' : 'white');
    statusText.textContent = (current === 1 ? '흑돌' : '백돌') + ' 차례';
    statusText.className = '';
  }

  function inBounds(c, r) { return c >= 0 && c < SIZE && r >= 0 && r < SIZE; }
  function getVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  function eventToCell(e) {
    const rect = canvas.getBoundingClientRect();
    const px = e.touches ? e.touches[0].clientX : e.clientX;
    const py = e.touches ? e.touches[0].clientY : e.clientY;
    const x = px - rect.left, y = py - rect.top;
    const c = Math.round((x - margin) / gap);
    const r = Math.round((y - margin) / gap);
    return inBounds(c, r) ? { c, r } : null;
  }

  canvas.addEventListener('click', (e) => {
    const cell = eventToCell(e);
    if (cell) place(cell.c, cell.r);
  });

  canvas.addEventListener('mousemove', (e) => {
    if (gameOver) return;
    const cell = eventToCell(e);
    const changed = JSON.stringify(cell) !== JSON.stringify(hover);
    hover = cell;
    if (changed) draw();
  });
  canvas.addEventListener('mouseleave', () => { hover = null; draw(); });

  undoBtn.addEventListener('click', undo);
  resetBtn.addEventListener('click', reset);
  window.addEventListener('resize', layout);

  reset();
  layout();
})();
</script>
</body>
</html>
